services:
  postgres:
    image: postgres:16-alpine
    container_name: examen_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: examen_microservicios
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend_tecnico:
    build: ./backend_tecnico
    container_name: backend_tecnico
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: examen_microservicios
    depends_on:
      - postgres

  frontend_tecnico:
    build: ./frontend_tecnico
    container_name: frontend_tecnico
    restart: always
    ports:
      - "5171:5171"
    depends_on:
      - backend_tecnico

volumes:
  postgres_data:
