<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Técnicos - Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main class="container">
        <section class="card auth-zone">
            <div class="auth-header">
                <div class="logo-placeholder">
                    <i data-lucide="shield-check"></i>
                </div>
                <h1>Portal de Técnicos</h1>
                <p class="descripcion">
                    Alta de personal en el sistema de microservicios.
                </p>
            </div>

            <form id="formTecnico" class="formulario">
                <div class="input-group">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" id="nombre" placeholder="Nombre completo" required />
                </div>

                <div class="input-group">
                    <i data-lucide="phone" class="input-icon"></i>
                    <input type="tel" id="telefono" placeholder="Teléfono de contacto (10 dígitos)" pattern="[0-9]{10}"
                        maxlength="10" required />
                </div>

                <button type="submit" class="btn-primary">
                    <i data-lucide="user-plus"></i> Registrar en Sistema
                </button>
            </form>

            <p id="mensaje" class="mensaje"></p>
        </section>

        <section class="card table-zone">
            <div class="table-header">
                <div>
                    <h2>Nómina Activa</h2>
                    <p class="subtext">Personal técnico registrado en la base de datos</p>
                </div>
                <i data-lucide="users" class="header-icon"></i>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Técnico</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaTecnicos">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();
    </script>
    <script type="module" src="./dist/main.js"></script>
</body>

</html>
