<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Técnicos</title>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Microservicio de Técnicos</h1>
            <p class="descripcion">
                Frontend SPA desarrollado con Bun, TypeScript, Fetch API y manipulación dinámica del DOM.
            </p>

            <form id="formTecnico" class="formulario">
                <input type="text" id="nombre" placeholder="Nombre del técnico" required />

                <input type="tel" id="telefono" placeholder="Teléfono (10 dígitos)" pattern="[0-9]{10}" maxlength="10"
                    required />
                <button type="submit">Guardar técnico</button>
            </form>

            <p id="mensaje" class="mensaje"></p>
        </section>

        <section class="card">
            <h2>Nómina de Técnicos</h2>

            <table>
                <thead>
                    <tr>
                        <th>ID Técnico</th>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaTecnicos">
                </tbody>
            </table>
        </section>
    </main>

    <script type="module" src="./dist/main.js"></script>
</body>

</html>
