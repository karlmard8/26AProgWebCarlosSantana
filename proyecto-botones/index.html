<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Simulación de botones</title>
    <script type="module" src="./src/main.ts"></script>
    <style>
        img.fake-button {
            width: 200;
            height: 150px;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #app {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .fake-button {
            cursor: pointer;
            padding: 20px 15px;
            border: 1px solid black;
            border-radius: 6px;
            background: lightblue;
            width: fit-content;
            transition: 0.2s;
            text-decoration: none;
            color: black;
            display: inline-block;
        }

        .fake-button:hover {
            background: black;
            color: white;
        }

        .fake-button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <h1>Simulación de botones con elementos HTML</h1>

    <div id="app"></div>
</body>

</html>
